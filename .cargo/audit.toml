# Both arrive through jsonwebtoken's rust_crypto backend, which lattice-core-api uses only to verify RS256
# access tokens against the identity provider's public keys. The timing leaks concern secret-key operations,
# which Lattice never performs. Keep in step with the ignore list in deny.toml.
[advisories]
ignore = [
  "RUSTSEC-2023-0071", # rsa: Marvin attack, private-key timing
  "RUSTSEC-2026-0387", # crypto-bigint: timing variability on secret values
]
