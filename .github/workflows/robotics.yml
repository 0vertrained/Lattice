name: Robotics integration

on:
  workflow_dispatch:
  # On main as well as on pull requests, so the default branch shows whether the simulated warehouse still passes.
  push:
    branches: [main]
    paths:
      - 'simulation/**'
      - 'services/lattice-ros2-gateway/**'
      - 'robots/lattice-ros2-body/**'
      - 'crates/**'
      - 'services/lattice-ai-gateway/**'
      - 'services/lattice-core-api/**'
      - 'scripts/*warehouse*'
      - 'scripts/smoke-*.py'
      - '.github/workflows/robotics.yml'
  pull_request:
    paths:
      - 'simulation/**'
      - 'services/lattice-ros2-gateway/**'
      - 'robots/lattice-ros2-body/**'
      - 'crates/**'
      - 'services/lattice-ai-gateway/**'
      - 'services/lattice-core-api/**'
      - 'scripts/*warehouse*'
      - 'scripts/smoke-*.py'
      - '.github/workflows/robotics.yml'

permissions:
  contents: read

jobs:
  warehouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: apps/control-center/package-lock.json
      - run: npm --prefix apps/control-center ci --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU inference dependencies
        run: |
          python -m venv services/lattice-ai-gateway/.venv
          services/lattice-ai-gateway/.venv/bin/pip install -r services/lattice-ai-gateway/requirements.txt
      - name: Create an ephemeral local simulation key
        run: |
          python3 - <<'PY'
          import secrets
          from pathlib import Path
          path = Path('.env')
          path.write_text('LATTICE_DEV_API_KEY=' + secrets.token_hex(32) + '\n')
          path.chmod(0o600)
          PY
      - name: Build and exercise navigation, watchdog, approval and camera inspection
        env:
          LATTICE_SMOKE: '1'
          CARGO_BUILD_JOBS: '2'
        run: ./scripts/run-warehouse.sh
      - name: Preserve simulation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warehouse-diagnostics
          path: |
            target/warehouse-run.*/core.log
            target/warehouse-run.*/body.log
            target/warehouse-run.*/frontend.log
            target/warehouse-run.*/ros.log
            target/warehouse-run.*/ai.log
            target/warehouse-run.*/inspection-evidence.jpg
            target/warehouse-run.*/intelligence-trace.json
          if-no-files-found: ignore
