name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-center
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: apps/control-center/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/lattice-ai-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m compileall app
      - run: python -m unittest discover -s tests -v
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
      - run: python evaluate.py ../../evaluation/ci-models.json
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-evaluation
          path: evaluation/ci-models.json

  motion-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test local motion lease, expiry and stop behavior
        run: |
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            -Iservices/lattice-ros2-gateway/include \
            services/lattice-ros2-gateway/test/motion_gate_test.cpp -o /tmp/motion-gate-test
          /tmp/motion-gate-test
      - name: Check rover geometry and drive configuration
        run: python3 -m unittest discover -s simulation -p 'test_*.py' -v

  postgres-recovery:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: lattice_units
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      LATTICE_TEST_DATABASE_URL: postgres://postgres:integration-only@127.0.0.1:5432/lattice_units
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Verify atomic transactions and restart recovery
        run: cargo test --locked -p lattice-infrastructure --test postgres_recovery -- --ignored
      - name: Verify immutable observations and reviewed handoff persistence
        run: |
          docker exec ${{ job.services.postgres.id }} createdb -U postgres lattice_observations
          docker exec ${{ job.services.postgres.id }} createdb -U postgres lattice_handoffs
          LATTICE_TEST_DATABASE_URL=postgres://postgres:integration-only@127.0.0.1:5432/lattice_observations cargo test --locked -p lattice-infrastructure --test observations -- --ignored
          LATTICE_TEST_DATABASE_URL=postgres://postgres:integration-only@127.0.0.1:5432/lattice_handoffs cargo test --locked -p lattice-infrastructure --test handoffs -- --ignored
      - name: Build core and create separate process-test database
        run: |
          cargo build --locked -p lattice-core-api
          docker exec ${{ job.services.postgres.id }} createdb -U postgres lattice_api
      - name: Crash and restart real HTTP processes
        run: python3 scripts/smoke-recovery.py
        env:
          LATTICE_TEST_DATABASE_URL: postgres://postgres:integration-only@127.0.0.1:5432/lattice_api

  hosted-identities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/control-center/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r tests/identity/requirements.txt
      - run: npm ci --no-audit --no-fund
        working-directory: apps/control-center
      - run: npx playwright install --with-deps chromium
        working-directory: apps/control-center
      - run: scripts/test-hosted.sh
      - run: scripts/test-handoff.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: identity-test-logs
          path: target/identity-test.*/*.log
