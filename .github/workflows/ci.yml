name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-center
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: apps/control-center/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/lattice-ai-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m compileall app
      - run: python -m unittest discover -s tests -v
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
      - run: python evaluate.py ../../evaluation/ci-models.json
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-evaluation
          path: evaluation/ci-models.json

  motion-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test local motion lease, expiry and stop behavior
        run: |
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            -Iservices/lattice-ros2-gateway/include \
            services/lattice-ros2-gateway/test/motion_gate_test.cpp -o /tmp/motion-gate-test
          /tmp/motion-gate-test
      - name: Check rover geometry and drive configuration
        run: python3 -m unittest discover -s simulation -p 'test_*.py' -v
