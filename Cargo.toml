[workspace]
resolver = "3"
members = [
  "crates/lattice-domain",
  "crates/lattice-application",
  "crates/lattice-infrastructure",
  "services/lattice-core-api",
  "robots/lattice-mock-body",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
license = "Apache-2.0"
authors = ["Lattice contributors"]

[workspace.dependencies]
async-trait = "0.1.89"
axum = { version = "0.8.4", features = ["json", "macros"] }
base64 = "0.22.1"
chrono = { version = "0.4.41", features = ["serde", "clock"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
http = "1.3.1"
rand_core = { version = "0.6.4", features = ["getrandom"] }
reqwest = { version = "0.12.22", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0.12"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5.2", features = ["limit", "timeout", "util"] }
tower-http = { version = "0.6.6", features = [
  "compression-gzip",
  "cors",
  "limit",
  "request-id",
  "set-header",
  "trace",
  "timeout",
] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
uuid = { version = "1.18.0", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
# Lower than the individual lints below, so they override the group.
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
